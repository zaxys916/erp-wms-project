# ERP-WMS 部署编排
# 默认：从 GHCR 拉取前后端镜像（CI 推送产物）
#   docker compose --profile app pull        # 拉取 MySQL/Redis/前后端镜像
#   docker compose --profile app up -d       # 启动（缺镜像会自动拉取）
# 本地源码构建（覆盖拉取）：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml --profile app up -d --build
# 访问：http://localhost:8080

# 镜像名变量：可整体指向私有仓库或指定版本
x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-ghcr.io/zaxys916/erp-wms-project-backend:latest}
x-frontend-image: &frontend-image
  image: ${FRONTEND_IMAGE:-ghcr.io/zaxys916/erp-wms-project-frontend:latest}

services:
  mysql:
    image: mysql:8.0
    container_name: wms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: wms_db
      MYSQL_USER: wms_user
      MYSQL_PASSWORD: wms_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwms_user", "-pwms_password"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: wms-redis
    ports:
      - "6379:6379"

  backend:
    <<: *backend-image
    container_name: wms-backend
    profiles: ["app"]
    env_file:
      - .env
    environment:
      # 容器内以服务名访问 MySQL / Redis
      DATABASE_URL: mysql+pymysql://wms_user:wms_password@mysql:3306/wms_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mysql:
        condition: service_healthy
    # 容器启动时自动执行 alembic 迁移（见 backend/Dockerfile）

  frontend:
    <<: *frontend-image
    container_name: wms-frontend
    profiles: ["app"]
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
