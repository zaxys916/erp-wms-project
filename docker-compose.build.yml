# 本地源码构建覆盖：与 docker-compose.yml 叠加使用
#   docker compose -f docker-compose.yml -f docker-compose.build.yml --profile app up -d --build
# 构建产物会以 docker-compose.yml 中的 image 名（默认 GHCR 路径）打标签，
# 方便与远端镜像同名切换；需要推送到远端仓库时请用 docker-publish workflow。
services:
  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}

  frontend:
    build:
      context: ./frontend
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
